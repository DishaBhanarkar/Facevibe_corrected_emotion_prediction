<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaceVibe</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
 
<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
:root {
  --bg:        #08090d;
  --surface:   #0f1117;
  --border:    rgba(255,255,255,0.08);
  --accent:    #7DF9C2;
  --accent2:   #4FC3F7;
  --danger:    #FF6B6B;
  --text:      #f0f0f0;
  --muted:     #6b7280;
  --radius:    18px;
}
 
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 60px;
  overflow-x: hidden;
}
 
/* ============ NOISE TEXTURE ============ */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}
 
/* ============ HEADER ============ */
header {
  text-align: center;
  margin-bottom: 40px;
  position: relative;
  z-index: 1;
}
 
.logo {
  font-family: 'Syne', sans-serif;
  font-size: clamp(36px, 7vw, 64px);
  font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
 
.tagline {
  font-size: 14px;
  color: var(--muted);
  margin-top: 4px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
 
/* ============ MAIN GRID ============ */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 100%;
  max-width: 860px;
  position: relative;
  z-index: 1;
}
 
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
}
 
/* ============ CARDS ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: border-color 0.25s;
}
 
.card:hover {
  border-color: rgba(125, 249, 194, 0.2);
}
 
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}
 
/* ============ FILE INPUT ============ */
.file-label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  padding: 28px 16px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-size: 13px;
  color: var(--muted);
}
 
.file-label:hover {
  border-color: var(--accent);
  background: rgba(125,249,194,0.03);
  color: var(--accent);
}
 
#imageInput { display: none; }
 
#file-name {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  min-height: 16px;
  transition: color 0.2s;
}
 
/* ============ VIDEO ============ */
#video {
  width: 100%;
  border-radius: 12px;
  background: #000;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}
 
/* ============ BUTTONS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}
 
.btn-primary {
  background: var(--accent);
  color: #08090d;
}
 
.btn-primary:hover {
  background: #5de8ab;
  transform: translateY(-1px);
}
 
.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid var(--border);
}
 
.btn-ghost:hover {
  background: rgba(255,255,255,0.1);
  transform: translateY(-1px);
}
 
.btn:active { transform: translateY(0); }
 
.btn-row {
  display: flex;
  gap: 8px;
}
 
/* ============ RESULT CARD ============ */
.result-card {
  width: 100%;
  max-width: 860px;
  margin-top: 16px;
  position: relative;
  z-index: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px;
  display: none;
  animation: fadeUp 0.4s ease;
}
 
.result-card.visible { display: block; }
 
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
 
.result-top {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}
 
.result-emoji {
  font-size: 56px;
  line-height: 1;
  filter: drop-shadow(0 0 20px rgba(125,249,194,0.3));
}
 
.result-label {
  font-family: 'Syne', sans-serif;
  font-size: clamp(26px, 5vw, 42px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
 
.result-conf {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}
 
/* ============ BAR CHART ============ */
.bars { display: flex; flex-direction: column; gap: 8px; }
 
.bar-row {
  display: grid;
  grid-template-columns: 80px 1fr 44px;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}
 
.bar-name { color: var(--muted); text-transform: capitalize; }
 
.bar-track {
  height: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 99px;
  overflow: hidden;
}
 
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.7s cubic-bezier(0.16,1,0.3,1);
}
 
.bar-pct {
  text-align: right;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
 
/* ============ STATUS ============ */
#status {
  position: relative;
  z-index: 1;
  font-size: 13px;
  color: var(--muted);
  min-height: 20px;
  text-align: center;
  margin-top: 12px;
  transition: color 0.2s;
}
 
#status.error { color: var(--danger); }
 
/* ============ FOOTER ============ */
footer {
  margin-top: 48px;
  font-size: 12px;
  color: var(--muted);
  position: relative;
  z-index: 1;
  text-align: center;
}
</style>
</head>
 
<body>
 
<header>
  <div class="logo">FaceVibe</div>
  <p class="tagline">Real-time emotion recognition</p>
</header>
 
<div class="grid">
 
  <!-- Upload Card -->
  <div class="card">
    <div class="card-title">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4-4 4 4 4-8 4 8"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 20h18"/></svg>
      Upload Image
    </div>
 
    <label class="file-label" for="imageInput">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 0l-3 3m3-3l3 3"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
      Click to choose a photo
    </label>
    <input type="file" id="imageInput" accept="image/*">
    <p id="file-name">No file chosen</p>
 
    <button class="btn btn-primary" onclick="uploadImage()">Analyse Emotion</button>
  </div>
 
  <!-- Camera Card -->
  <div class="card">
    <div class="card-title">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/></svg>
      Live Camera
    </div>
 
    <video id="video" autoplay playsinline></video>
 
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="startCamera()">Start Camera</button>
      <button class="btn btn-primary" onclick="capture()">Capture &amp; Predict</button>
    </div>
  </div>
 
</div>
 
<!-- Result -->
<div class="result-card" id="resultCard">
  <div class="result-top">
    <div class="result-emoji" id="resultEmoji">—</div>
    <div>
      <div class="result-label" id="resultLabel">—</div>
      <div class="result-conf" id="resultConf"></div>
    </div>
  </div>
  <div class="bars" id="barsContainer"></div>
</div>
 
<p id="status"></p>
 
<footer>Made by Disha Bhanarkar</footer>
 
<script>
const video     = document.getElementById("video");
const fileInput = document.getElementById("imageInput");
const fileName  = document.getElementById("file-name");
const resultCard= document.getElementById("resultCard");
const status    = document.getElementById("status");
 
const emojiMap = {
  happy:"😄", sad:"😢", angry:"😡",
  surprise:"😲", fear:"😨", disgust:"🤢", neutral:"😐"
};
 
// ✅ Point to your Render/Railway URL when deployed
// Change this line to your deployed backend URL, e.g.:
// const BACKEND = "https://facevibe.onrender.com";
const BACKEND = "http://127.0.0.1:10000";
 
fileInput.addEventListener("change", () => {
  fileName.textContent = fileInput.files[0]?.name || "No file chosen";
  fileName.style.color = "#7DF9C2";
});
 
function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; })
    .catch(() => setStatus("Please allow camera access in your browser.", true));
}
 
function uploadImage() {
  const file = fileInput.files[0];
  if (!file) return setStatus("Please choose an image first.", true);
  sendToBackend(file);
}
 
function capture() {
  if (!video.srcObject) return setStatus("Start the camera first.", true);
  const canvas = document.createElement("canvas");
  canvas.width  = 640;
  canvas.height = 480;
  canvas.getContext("2d").drawImage(video, 0, 0, 640, 480);
  canvas.toBlob(blob => sendToBackend(blob), "image/jpeg", 0.92);
}
 
async function sendToBackend(file) {
  setStatus("Analysing…");
  resultCard.classList.remove("visible");
 
  const form = new FormData();
  form.append("image", file);
 
  try {
    const res  = await fetch(`${BACKEND}/predict`, { method: "POST", body: form });
    const data = await res.json();
 
    if (data.error) return setStatus(data.error, true);
 
    const emotion    = data.emotion.toLowerCase();
    const confidence = data.confidence;
 
    document.getElementById("resultEmoji").textContent = emojiMap[emotion] || "🤔";
    document.getElementById("resultLabel").textContent = data.emotion.toUpperCase();
    document.getElementById("resultConf").textContent  =
      `Confidence: ${(confidence * 100).toFixed(1)}%`;
 
    // Draw bars for all scores
    const bars = document.getElementById("barsContainer");
    bars.innerHTML = "";
    if (data.all_scores) {
      const entries = Object.entries(data.all_scores).sort((a,b) => b[1]-a[1]);
      entries.forEach(([label, score]) => {
        const pct = (score * 100).toFixed(1);
        bars.innerHTML += `
          <div class="bar-row">
            <span class="bar-name">${label}</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%"></div>
            </div>
            <span class="bar-pct">${pct}%</span>
          </div>`;
      });
    }
 
    resultCard.classList.add("visible");
    setStatus("");
 
  } catch (err) {
    setStatus("Cannot reach the server. Is app.py running?", true);
  }
}
 
function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.className = isError ? "error" : "";
}
</script>
 
</body>
</html>
